<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-label="Anas Saad  from aerospace systems to software and GenAI">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="48%" stop-color="#0b1a28"/>
      <stop offset="100%" stop-color="#06131d"/>
    </linearGradient>
    <radialGradient id="glowA" cx="16%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="88%" cy="82%" r="50%">
      <stop offset="0%" stop-color="#e8b84a" stop-opacity="0.20"/>
