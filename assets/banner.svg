  <rect width="1280" height="420" rx="28" fill="url(#glowB)"/>
  <rect width="1280" height="420" rx="28" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1277" height="417" rx="26.5" fill="none" stroke="#67e8f9" stroke-opacity="0.18" stroke-width="1.5"/>

  <g fill="none" stroke="#67e8f9" stroke-opacity="0.55" stroke-width="1.5">
    <path d="M36 78V48h30"/>
    <path d="M1244 78V48h-30"/>
    <path d="M36 342v30h30"/>
    <path d="M1244 342v30h-30"/>
  </g>

  <path d="M90 290 C 280 290, 340 150, 560 168 S 860 310, 1190 150" fill="none" stroke="url(#path)" stroke-width="10" stroke-linecap="round" opacity="0.14"/>
  <path d="M90 290 C 280 290, 340 150, 560 168 S 860 310, 1190 150" fill="none" stroke="url(#path)" stroke-width="2.4" stroke-linecap="round"/>

  <g>
