    <rect x="516" y="328" width="148" height="34" rx="17" fill="#1a1608" stroke="#e8b84a" stroke-opacity="0.45"/>
    <text x="590" y="350" text-anchor="middle" fill="#fde68a">GenAI @ BMO</text>
